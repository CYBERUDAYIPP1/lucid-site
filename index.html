<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUCID Clothing</title>

<!-- LINK CSS -->
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV -->
<nav>
  <div class="logo">LUCID</div>
  <div class="cart" onclick="toggleCart()">🛒 (<span id="cart-count">0</span>)</div>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Stay Clear. Stay Lucid.</h1>
  <p>Premium Streetwear Collection</p>
</section>

<!-- PRODUCTS -->
<section class="products" id="product-list"></section>

<!-- CART -->
<div class="cart-box" id="cartBox">
  <h2>Your Cart</h2>
  <div id="cart-items"></div>

  <button onclick="orderNow()">Order via WhatsApp</button>
</div>

<!-- FOOTER -->
<footer>© 2026 LUCID Clothing</footer>

<!-- LINK JS -->
<script src="script.js"></script>

</body>
</html>
